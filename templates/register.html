{% extends "base.html" %}
{% set active_page = 'register' %}

{% block content %}

<section class="auth-card card">
    <h1>Create an account</h1>
    <p class="muted">The first account created becomes the administrator.</p>

    <form method="POST">
        <label>Username
            <input type="text" name="username" required minlength="3">
        </label>

        <label>Full name
            <input type="text" name="full_name">
        </label>

        <label>Email
            <input type="email" name="email">
        </label>

        <label>Password
            <input type="password" name="password" required minlength="6">
        </label>

        <label>Role
            <select name="role">
                {% for role in roles %}
                <option value="{{ role }}">{{ role }}</option>
                {% endfor %}
            </select>
        </label>

        <button type="submit" class="main-button">Register</button>
    </form>

    <p class="muted">Already registered? <a href="{{ url_for('login') }}">Sign in</a>.</p>
</section>

{% endblock %}
